services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zai}
      POSTGRES_USER: ${POSTGRES_USER:-zai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zai}
    ports:
      - "5432:5432"
    volumes:
      # Scripts here run only when the data volume is empty (first start or after `docker compose down -v`).
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-zai}
      DB_USERNAME: ${POSTGRES_USER:-zai}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-zai}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  sensor_server:
    build:
      context: .
      dockerfile: sensor_server.Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
      # Key returned by POST /api/sensors; without it the sensor only serves readings locally.
      SENSOR_API_KEY: ${SENSOR_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
