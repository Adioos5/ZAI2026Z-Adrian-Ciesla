services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zai}
      POSTGRES_USER: ${POSTGRES_USER:-zai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zai}
    ports:
      - "5432:5432"
    volumes:
      # Scripts here run only when the data volume is empty (first start or after `docker compose down -v`).
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
