spring.application.name=backend
server.port=${PORT:8080}

# H2 file database by default; point DB_URL at PostgreSQL (jdbc:postgresql://...) in production.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/zai}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Initial administrator account, created on first start if it does not exist yet.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
app.auth.token-ttl-seconds=${TOKEN_TTL_SECONDS:3600}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
