# Activate with SPRING_PROFILES_ACTIVE=postgres; the database is started by ../docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zai}
spring.datasource.username=${DB_USERNAME:zai}
spring.datasource.password=${DB_PASSWORD:zai}

# Tables are created by db/init/01-schema.sql; Hibernate only checks that they match the entities.
spring.jpa.hibernate.ddl-auto=validate
