# CI for the ZAI 26Z project: backend build and tests (H2 and PostgreSQL) and a secret scan.

name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**.md" ]
  workflow_dispatch:

# A newer push to the same branch / PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test (H2)
    runs-on: ubuntu-latest
    permissions:
      contents: write  # dependency graph submission
      checks: write    # test report
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: backend/pom.xml
    # JaCoCo is invoked from the command line so the POM does not need the plugin;
    # the coverage report is written to backend/target/site/jacoco.
    - name: Build with Maven
      run: >-
        mvn -B --file backend/pom.xml
        org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent
        verify
        org.jacoco:jacoco-maven-plugin:0.8.13:report

    - name: Publish test report
      if: always()
      uses: mikepenz/action-junit-report@v5
      with:
        report_paths: backend/target/surefire-reports/TEST-*.xml
        check_name: Test report (H2)

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend/target/*.jar
        retention-days: 7

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: backend/target/site/jacoco/
        retention-days: 7

    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts.
    - name: Update dependency graph
      if: github.event_name == 'push'
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      with:
        directory: backend

  test-postgres:
    name: Test against PostgreSQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zai
          POSTGRES_USER: zai
          POSTGRES_PASSWORD: zai
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U zai -d zai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: backend/pom.xml
    # The tests restart the Spring context after every test method and expect an empty
    # database, so Hibernate recreates the tables here instead of validating them.
    - name: Run tests on PostgreSQL
      run: mvn -B verify --file backend/pom.xml
      env:
        SPRING_PROFILES_ACTIVE: postgres
        DB_URL: jdbc:postgresql://localhost:5432/zai
        DB_USERNAME: zai
        DB_PASSWORD: zai
        SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    - name: Publish test report
      if: always()
      uses: mikepenz/action-junit-report@v5
      with:
        report_paths: backend/target/surefire-reports/TEST-*.xml
        check_name: Test report (PostgreSQL)

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
